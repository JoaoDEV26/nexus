name: Nexus CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: nexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://nexus:test-only-password@localhost:5432/nexus_test
      TEST_DATABASE_URL: postgresql+psycopg://nexus:test-only-password@localhost:5432/nexus_test
      JWT_SECRET: isolated-test-key-with-more-than-thirty-two-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/setup_env.py
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d db
      - run: docker compose run --rm api alembic upgrade head
      - run: docker compose up -d api web
      - name: Aguardar API e interface
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready && curl -fsS http://localhost:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=100
          exit 1
      - if: always()
        run: docker compose down -v
