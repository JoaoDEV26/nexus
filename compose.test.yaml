name: nexus-tests
services:
  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: nexus_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_test"]
      interval: 3s
      timeout: 3s
      retries: 30
  tests:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nexus:test-only-password@db-test:5432/nexus_test
      TEST_DATABASE_URL: postgresql+psycopg://nexus:test-only-password@db-test:5432/nexus_test
      JWT_SECRET: isolated-test-key-with-more-than-thirty-two-characters
    depends_on:
      db-test:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && alembic check && ruff check . && pytest -q"]
